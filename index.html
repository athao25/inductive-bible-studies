<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Inductive Bible Studies</title>
<link rel="stylesheet" href="assets/lms.css">
<script src="assets/theme.js"></script>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a2e2e">
<script src="assets/config.js" defer></script>
<script src="assets/vendor/supabase.js" defer></script>
<script src="assets/data/courses.js" defer></script>
<script src="assets/store.js" defer></script>
<script src="assets/ui.js" defer></script>
<script src="assets/dashboard.js" defer></script>
<script src="assets/shell.js" defer></script>
</head>
<body data-nav="dashboard">
<main>
  <div class="dash-head">
    <div>
      <div class="eyebrow" id="date-line"></div>
      <h1 class="page-h1" id="greeting"></h1>
    </div>
  </div>

  <div class="fav-banner">
    <div class="fav-label">Favorite verse</div>
    <div class="fav-text" id="fav-text"></div>
    <div class="fav-ref" id="fav-ref"></div>
    <button class="fav-edit" id="fav-edit" type="button" title="Edit favorite verse">✎</button>
  </div>

  <div class="resume" id="resume">
    <div>
      <div class="resume-kicker" id="resume-kicker">Continue where you left off</div>
      <div class="resume-title" id="resume-title"></div>
      <div class="resume-meta" id="resume-meta"></div>
    </div>
    <button class="btn" id="resume-btn" type="button">Resume →</button>
  </div>

  <div class="dash-grid">
    <div class="dash-col">
      <section class="lms-card">
        <div class="card-head">
          <h2>My courses</h2>
          <a class="card-link" id="browse" href="courses.html">Browse catalog</a>
        </div>
        <div id="course-rows"></div>
      </section>
      <section class="lms-card">
        <h2>Quiz history</h2>
        <div id="quiz-rows"></div>
      </section>
    </div>
    <div class="dash-col">
      <section class="lms-card">
        <h2>Recent notes</h2>
        <div id="note-briefs" style="display:flex; flex-direction:column; gap:12px;"></div>
        <a class="card-link" id="open-notebook" href="notebook.html" style="display:block; margin-top:14px;">Open notebook →</a>
      </section>
    </div>
  </div>
</main>
</body>
</html>
